; Dash unit — ESP32-C3 (generic USB-C dev board)

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Pin the monitor to this board by USB VID:PID (Espressif native USB-CDC), so both
; units can be monitored simultaneously regardless of port names / plug order.
monitor_port = hwgrep://303A:1001

lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0

; Serial over the native USB-C port
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I ${PROJECT_DIR}/../common
  -D DEBUG_BUILD

; Enforce explicit conversions in our own source (not framework code).
build_src_flags =
  -Wconversion
  -Wsign-conversion