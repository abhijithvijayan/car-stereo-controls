; Wheel unit — Seeed XIAO nRF52840 (non-Sense)

[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino

monitor_speed = 115200
; Pin the monitor to this board by USB VID:PID (Seeed XIAO nRF52840), so both
; units can be monitored simultaneously regardless of port names / plug order.
monitor_port = hwgrep://2886:8044

; QSPI flash transport, used only to deep power-down the unused 2MB flash chip.
lib_deps =
    adafruit/Adafruit SPIFlash

; Uncomment for debug build : enables Serial logging + advertised BLE name.
build_flags =
;    -D DEBUG_BUILD
    -I ${PROJECT_DIR}/../common

; Enforce explicit conversions in our own source (not framework code).
build_src_flags =
    -Wconversion
    -Wsign-conversion
